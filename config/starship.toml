# Catppuccin Macchiato palette
# Base: #24273a | Mantle: #1e2030 | Surface0: #363a4f | Surface1: #494d64
# Blue: #8aadf4 | Mauve: #c6a0f6 | Lavender: #b7bdf8 | Text: #cad3f5

format = """
[░▒▓](#b7bdf8)\
[  ](bg:#b7bdf8 fg:#24273a)\
[](bg:#8aadf4 fg:#b7bdf8)\
$directory\
[](fg:#8aadf4 bg:#494d64)\
$git_branch\
$git_status\
[](fg:#494d64 bg:#363a4f)\
$nodejs\
$rust\
$golang\
$php\
[](fg:#363a4f bg:#1e2030)\
$time\
[ ](fg:#1e2030)\
\n$character"""

[directory]
style = "fg:#cad3f5 bg:#8aadf4"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = " "
"Pictures" = " "

[git_branch]
symbol = ""
style = "bg:#494d64"
format = '[[ $symbol $branch ](fg:#8aadf4 bg:#494d64)]($style)'

[git_status]
style = "bg:#494d64"
format = '[[($all_status$ahead_behind )](fg:#8aadf4 bg:#494d64)]($style)'

[nodejs]
symbol = ""
style = "bg:#363a4f"
format = '[[ $symbol ($version) ](fg:#8aadf4 bg:#363a4f)]($style)'

[rust]
symbol = ""
style = "bg:#363a4f"
format = '[[ $symbol ($version) ](fg:#8aadf4 bg:#363a4f)]($style)'

[golang]
symbol = ""
style = "bg:#363a4f"
format = '[[ $symbol ($version) ](fg:#8aadf4 bg:#363a4f)]($style)'

[php]
symbol = ""
style = "bg:#363a4f"
format = '[[ $symbol ($version) ](fg:#8aadf4 bg:#363a4f)]($style)'

[time]
disabled = false
time_format = "%R" # Hour:Minute Format
style = "bg:#1e2030"
format = '[[  $time ](fg:#b7bdf8 bg:#1e2030)]($style)'
